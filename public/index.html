<style>

:root[data-t=dark]{--bg:#061219;--sf:#0d202b;--sf2:#102833;--tx:#e6f0f4;--mu:#86a0ad;--bd:#1a3441;--ac:#2cc7b9;--ac-d:#1aa79a;--ac2:#10343a;--ok:#3ddc9a;--er:#ff6b76;--wn:#f5b942;--am:#f5b942;--sb:#081820;--sbt:#7f9ba8;--sh:0 1px 1px #0005,0 20px 40px -22px #000d;--glow:0 10px 26px -8px #2cc7b966;color-scheme:dark}

th,td{padding:13px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}
tbody tr{transition:background .12s}tbody tr:hover td{background:var(--sf2)}tbody tr td:first-child{border-radius:0 12px 12px 0}tbody tr td:last-child{border-radius:12px 0 0 12px}
tbody tr:last-child td{border-bottom:0}td .btn+.btn{margin-right:6px}td small{font-size:12px}

.pill.ok,.pill.er,.pill.wn{background:color-mix(in srgb,currentColor 13%,transparent)}.pill.ok{color:var(--ok)}.pill.er{color:var(--er)}.pill.wn{color:var(--wn)}
.pill.ok::before,.pill.er::before,.pill.wn::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:10px;border-radius:3px;background:var(--bd);overflow:hidden;min-width:110px;margin-bottom:6px;-webkit-mask:repeating-linear-gradient(270deg,#000 0 5px,transparent 5px 8px);mask:repeating-linear-gradient(270deg,#000 0 5px,transparent 5px 8px)}
.bar i{display:block;height:100%;background:linear-gradient(270deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#7ff3e8));transition:width .6s cubic-bezier(.2,.8,.2,1)}.bar i.hot{background:linear-gradient(270deg,var(--er),var(--am))}
.mu{color:var(--mu)}.empty{text-align:center;color:var(--mu);padding:34px}
.notice{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--am) 13%,var(--sf));border:1px solid color-mix(in srgb,var(--am) 40%,transparent);color:var(--wn);border-radius:16px;padding:13px 18px;margin-bottom:18px;font-weight:500}
pre{direction:ltr;text-align:left;margin:8px 0;padding:13px 14px;border-radius:14px;background:var(--sf2);border:1px solid var(--bd);font:12px/1.65 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.kv{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.kv span{width:100px;flex:none;color:var(--mu);font-size:13px}.kv code{flex:1;direction:ltr;text-align:left;font:12.5px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.cfg{padding:16px 0;border-bottom:1px solid var(--bd)}.cfg:last-child{border:0;padding-bottom:0}.cfg:first-of-type{padding-top:0}.cfg h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--sf);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);padding:5px;border-radius:18px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--sh)}
.tab{flex:1;white-space:nowrap;border:0;background:none;padding:10px 16px;border-radius:13px;font-weight:700;color:var(--mu);cursor:pointer;transition:background .18s,color .18s}
.tab:hover{color:var(--tx)}.tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 92%,#fff),var(--ac-d));color:#fff;box-shadow:var(--glow)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.login .card{position:relative;width:100%;max-width:410px;padding:34px 30px;border-radius:28px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.login .logo{width:60px;height:60px;border-radius:20px;margin:6px auto 20px}
.login .logo::before,.login .logo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--ac);opacity:0;animation:ping 2.8s cubic-bezier(.2,.6,.3,1) .5s 2}
.login .logo::after{animation-delay:1.1s}
.login h2{text-align:center;font-size:21px;font-weight:800;margin:0 0 4px}.login p.sub{margin:0 0 10px;text-align:center;color:var(--mu);font-size:13px}.login .btn{width:100%;padding:13px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b1f2af2;color:#e6f0f4;padding:11px 22px;border-radius:99px;z-index:99;display:none;font-weight:600;box-shadow:0 18px 40px -12px #000a,inset 0 0 0 1px #ffffff1a;animation:tin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.pub{max-width:780px;margin:0 auto;padding:26px 16px 70px}.pub .brand{color:var(--tx);padding:0 0 20px}
ol.st{padding-right:20px;margin:0 0 8px;color:var(--mu)}
@media(max-width:899px){.app{padding:0;gap:0;display:block}.side{position:fixed;top:0;bottom:0;right:0;height:auto;width:270px;border-radius:26px 0 0 26px;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.side.open{transform:none}.ib{display:grid}.top{top:0;margin:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.top h1{font-size:20px}main{padding-inline:14px}.nav.on::before{right:-12px}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;gap:10px;flex-direction:column;align-items:flex-start;border-radius:18px}.stat b{font-size:20px}.card{padding:18px;border-radius:20px}.top h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa=n=>Number(n||0).toLocaleString("fa-IR"),toman=n=>fa(n)+" تومان";
const IC={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M19 8v6M16 11h6"/>',

package:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>',
sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
wallet:'<path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14" r="1"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
shield:'<path d="M12 3 4 6v6c0 4.8 3.3 8 8 9 4.7-1 8-4.2 8-9V6z"/><path d="m12.8 8-2.8 4.2h3.2L12 16"/>',
menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'};
const ic=(n,s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let S=null,TOK=ss.get("t"),UID=ss.get("u"),page="dash";
const ERR={"Wrong email or password":"ایمیل یا رمز عبور اشتباه است","Too many attempts, wait 1 min":"تلاش بیش از حد؛ یک دقیقه صبر کنید","Account disabled":"حساب غیرفعال است","Please log in":"لطفاً وارد شوید","Plan not found":"پلن پیدا نشد","Not enough balance":"موجودی کافی نیست؛ ابتدا کیف پول را شارژ کنید","Below minimum":"مبلغ کمتر از حداقل شارژ است","Admins only":"این بخش مخصوص ادمین است","Invalid or duplicate":"ایمیل تکراری است یا رمز کوتاه است (حداقل ۸ کاراکتر)","Bad state":"داده نامعتبر است","not found":"پیدا نشد","server error":"خطای سرور"};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
async function api(p,m="GET",b){let r;try{r=await fetch("/api/"+p,{method:m,headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{})},body:b?JSON.stringify(b):undefined})}catch(e){throw new Error("ارتباط با سرور برقرار نشد")}
 let j={};try{j=await r.json()}catch(e){}
 if(r.status==401&&TOK&&p!="login"){logout();throw new Error("نشست شما تمام شد؛ دوباره وارد شوید")}
 if(!r.ok)throw new Error(ERR[j.error]||j.error||"خطایی رخ داد");return j}
const safe=f=>(...a)=>Promise.resolve().then(()=>f(...a)).catch(e=>toast(e.message||"خطا"));
const me=()=>S.users.find(u=>u.id==UID)||{},isAdmin=()=>me().role=="admin",reps=()=>S.users.filter(u=>u.role=="rep");
const pn=id=>(S.plans.find(p=>p.id==id)||{}).name||"-";
const left=s=>Math.max(0,Math.ceil((s.exp-Date.now())/864e5)),used=s=>+(+s.used).toFixed(2),cap=s=>+(s.gb*(s.mult||1)).toFixed(2);
const active=s=>s.on&&left(s)>0&&used(s)<cap(s);
const bar=s=>{const p=Math.min(100,used(s)/cap(s)*100);return `<div class="bar"><i style="width:${p}%" class="${p>85?"hot":""}"></i></div>`};
const subLink=s=>location.origin+"/sub/"+s.tok,pageLink=s=>location.origin+"/#/sub/"+s.tok;
const tbl=(h,r)=>r.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.join("")}</tbody></table></div>`:`<div class="empty">موردی وجود ندارد</div>`;
const stat=(v,l,i)=>`<div class="stat"><div class="si">${ic(i,22)}</div><div><b>${v}</b><span>${l}</span></div></div>`;
const pill=(t,c)=>`<span class="pill ${c||""}">${t}</span>`;
const cpb=(t,l="کپی")=>`<button class="btn s g" data-copy="${esc(t)}">${l}</button>`;
const kv=(k,v)=>`<div class="kv"><span>${k}</span><code>${esc(v)}</code>${cpb(v)}</div>`;
const M=h=>{$("#mn").innerHTML=h};
const load=async()=>{S=await api("state")};

const stab=t=>{STAB=t;drawSub()};
function drawSub(){
 const d=SD,s=d.sub,ua=navigator.userAgent,os=/android/i.test(ua)?"android":/iphone|ipad|ipod/i.test(ua)?"ios":/mac/i.test(ua)?"mac":/win/i.test(ua)?"windows":"linux";
 const url=location.origin+"/sub/"+s.tok,ok=active(s),sv=d.servers;
 const none=`<div class="notice">${ic("alert",20)}<div>هنوز سروری برای این اشتراک فعال نشده است. با پشتیبانی تماس بگیرید.</div></div>`;
 let body="";
 if(STAB=="v2"){body=`<div class="card"><h2>اتصال سریع روی ${OSN[os]}</h2><ol class="st"><li>یکی از برنامه‌های زیر را نصب کنید.</li><li>دکمه «افزودن به برنامه» را بزنید یا لینک ساب را در برنامه وارد کنید (Import from URL).</li><li>اشتراک را به‌روزرسانی کنید، حالت «خودکار» را انتخاب کنید و وصل شوید.</li></ol>
 ${APPS[os].map(a=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${a[0]}</b><div style="margin-top:6px"><a class="btn s g" href="${a[1]}" target="_blank" rel="noopener">دانلود</a> ${a[2]?`<a class="btn s" href="${a[2]}${a[2].endsWith("=")?encodeURIComponent(url):url}">افزودن به برنامه</a>`:""}</div></div>`).join("")}
 <label>لینک ساب</label><pre>${esc(url)}</pre>${cpb(url,"کپی لینک ساب")}</div>
 <div class="card"><h2>کانفیگ‌های VLESS</h2>${d.set.relay!==false?`<div class="cfg"><h3>${esc(d.set.site||"VPN")} ${pill("WS")}</h3><pre>${esc(relayLink(s))}</pre>${cpb(relayLink(s))}</div>`:""}${sv.length||d.set.relay!==false?sv.map(v=>cfgsOf(v).map(c=>`<div class="cfg"><h3>${esc(v.name)} ${pill(c.tr.toUpperCase())}</h3><pre>${esc(vless(s,v,c))}</pre>${cpb(vless(s,v,c))}</div>`).join("")).join(""):none}</div>`}
 if(STAB=="ovpn"){body=`<div class="card"><h2>OpenVPN</h2>${sv.length?sv.map(v=>`<div class="cfg"><h3>${esc(v.name)}</h3>${kv("آدرس سرور",v.addr)}${kv("پورت",String(v.ports.ovpn))}${kv("نام کاربری",s.id)}${kv("رمز عبور",s.pw)}${d.set.ovpn?`<div style="margin-top:10px"><a class="btn s" href="/ovpn/${s.tok}/${v.id}">دانلود فایل OpenVPN</a></div>`:`<p class="mu" style="margin:8px 0 0;font-size:12.5px">فایل پیکربندی هنوز توسط ادمین تنظیم نشده است.</p>`}</div>`).join(""):none}<p class="mu" style="font-size:12.5px;margin-bottom:0">فایل را در برنامه OpenVPN Connect وارد کنید و نام کاربری و رمز بالا را بزنید.</p></div>`}
 if(STAB=="l2tp"){body=`<div class="card"><h2>L2TP / IPsec</h2>${sv.length?sv.map(v=>`<div class="cfg"><h3>${esc(v.name)}</h3>${kv("نوع","L2TP/IPsec PSK")}${kv("آدرس سرور",v.addr)}${kv("کلید IPsec (PSK)",d.set.psk)}${kv("نام کاربری",s.id)}${kv("رمز عبور",s.pw)}</div>`).join(""):none}<p class="mu" style="font-size:12.5px;margin-bottom:0">در تنظیمات VPN دستگاه (اندروید، آیفون، ویندوز یا مک) یک اتصال جدید از نوع «L2TP/IPsec با کلید از پیش‌اشتراکی» بسازید و مقادیر بالا را وارد کنید.</p></div>`}
 $("#app").innerHTML=`<div class="pub"><div class="brand"><span class="logo">${ic("shield")}</span>${esc(d.set.site||"VPN")}</div>
 ${ok?"":`<div class="notice">${ic("alert",20)}<div>این اشتراک منقضی شده یا حجمش تمام شده است.</div></div>`}
 <div class="card"><h2>${esc(s.name)} ${ok?pill("فعال","ok"):pill("غیرفعال","er")}</h2>${bar(s)}
 <div class="stats" style="margin:16px 0 0">${stat(fa(used(s))+" از "+fa(cap(s)),"گیگابایت مصرف‌شده","chart")}${stat(fa(left(s)),"روز باقی‌مانده","clock")}${stat(fa(s.users),"دستگاه هم‌زمان","users")}${stat(new Date(s.exp).toLocaleDateString("fa-IR"),"تاریخ انقضا","check")}</div></div>
 <div class="tabs"><button class="tab ${STAB=="v2"?"on":""}" onclick="stab('v2')">V2Ray / VLESS</button><button class="tab ${STAB=="ovpn"?"on":""}" onclick="stab('ovpn')">OpenVPN</button><button class="tab ${STAB=="l2tp"?"on":""}" onclick="stab('l2tp')">L2TP</button></div>${body}</div>`}

document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b){try{navigator.clipboard.writeText(b.dataset.copy)}catch(x){}toast("کپی شد")}});
addEventListener("hashchange",render);
(async()=>{if(TOK&&!location.hash.startsWith("#/sub/")){try{await load()}catch(e){S=null}}render()})();
</script>
</body>
</html>
